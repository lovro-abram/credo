<html lang="en">

    <link rel="stylesheet" href="css/fonts.css?v=28">
    <link rel="stylesheet" href="css/style.css?v=28">

    <style>
        /* ═══ Wallpaper Editor — 4-step wizard ═══
           Reuses the global neo-brutalist tokens from css/style.css
           (--paper, --surface, --ink, --green, --shadow-c, ...).
           Structure: stepper → shared live preview → one step card at a
           time, each ending with Back / Next. The old single-column wall
           of controls (margins, lock, sliders for everything) is gone:
           left/right margins and the lock button were removed entirely,
           the vertical slider was replaced by dragging the text on the
           preview (pointer events — mouse, touch and pen all work). */

        :root { --ease: cubic-bezier(.4,0,.2,1); }

        main { display: block; }

        .editor-container {
            max-width: 560px;
            margin: 0 auto;
            padding: 14px 16px 28px;
        }

        /* ── Stepper: circles + progress ─────────────────────────────── */
        .stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 0 10px;
        }
        .step-dot {
            width: 36px; height: 36px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 3px solid var(--ink);
            background: var(--surface);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ink);
            transition: background 0.2s var(--ease), color 0.2s var(--ease);
        }
        .step-dot.current {
            background: var(--green);
            color: var(--on-green);
            box-shadow: 2px 2px 0 0 var(--shadow-c);
        }
        .step-dot.done { background: var(--green-tint); }
        .step-dot.done .material-icons-round { font-size: 18px; }
        .step-line {
            width: 30px; height: 3px;
            background: var(--ink);
            opacity: 0.18;
            transition: background 0.2s var(--ease), opacity 0.2s var(--ease);
        }
        .step-line.filled { background: var(--green); opacity: 1; }

        .step-title {
            text-align: center;
            font-family: var(--font-display);
            font-size: 1.05rem;
            letter-spacing: 0.02em;
            margin-bottom: 12px;
            color: var(--ink);
        }

        /* ── Shared live preview ─────────────────────────────────────── */
        .preview-section {
            position: relative;
            width: 100%;
            border: var(--border-w) solid var(--ink);
            border-radius: var(--r-xl);
            background: var(--surface-2);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        #canvas-preview {
            display: block;
            width: 100%;
            height: auto;
            background: var(--surface-2);
            /* Dragging the text must not scroll the page on touch devices */
            touch-action: none;
        }
        #canvas-preview.can-pan,
        #canvas-preview.can-drag { cursor: grab; }
        #canvas-preview.dragging { cursor: grabbing; }

        .upload-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            cursor: pointer;
            padding: 20px;
        }
        .upload-overlay.drag-active { background: var(--green-tint); }
        .upload-icon { font-size: 44px; color: var(--green-text); }
        .upload-text { font-family: var(--font-ui); font-weight: 700; color: var(--ink); }
        .upload-hint { font-size: 0.8rem; color: var(--ink-soft); }

        .change-image-btn {
            position: absolute;
            top: 10px; right: 10px;
            display: none;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background: var(--surface);
            border: 2px solid var(--ink);
            border-radius: var(--r-pill);
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--ink);
            box-shadow: 2px 2px 0 0 var(--shadow-c);
            cursor: pointer;
        }
        .change-image-btn.visible { display: inline-flex; }
        .change-image-btn .material-icons-round { font-size: 16px; }

        /* ── Step cards ──────────────────────────────────────────────── */
        .wstep { display: none; }
        .wstep.active { display: block; animation: stepIn 0.22s var(--ease); }
        @keyframes stepIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .step-card {
            border: var(--border-w) solid var(--ink);
            border-radius: var(--r-xl);
            background: var(--surface);
            box-shadow: var(--shadow-md);
            padding: 14px;
            margin-top: 14px;
        }

        .control-label {
            display: block;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-soft);
            margin: 12px 2px 6px;
        }
        .control-group:first-child .control-label { margin-top: 0; }

        /* Chip rows: ratios, fonts, align, outline, automatic shadow */
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 8px 14px;
            background: var(--surface);
            border: 2px solid var(--ink);
            border-radius: var(--r-pill);
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--ink);
            cursor: pointer;
            box-shadow: 2px 2px 0 0 var(--shadow-c);
            transition: transform 0.12s var(--ease), box-shadow 0.12s var(--ease),
                        background 0.12s var(--ease);
        }
        .chip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 var(--shadow-c); }
        .chip:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 var(--shadow-c); }
        .chip.active { background: var(--green); color: var(--on-green); }
        /* The Text Shadow chip is an INDICATOR, not a choice — the shadow
           color always follows the text color (light text → black shadow,
           dark text → white shadow). */
        .chip:disabled { pointer-events: none; cursor: default; }

        .font-option.playfair   { font-family: 'Playfair Display', serif; }
        .font-option.lato       { font-family: 'Lato', sans-serif; }
        .font-option.caveat     { font-family: 'Caveat', cursive; font-size: 1rem; }
        .font-option.merriweather { font-family: 'Merriweather', serif; font-size: 0.78rem; }

        /* Small print under the automatic shadow indicator */
        .ref-note {
            margin: 6px 2px 0;
            font-family: var(--font-ui);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--ink-soft);
        }

        /* Color swatches */
        .color-swatch {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            cursor: pointer;
            box-shadow: 2px 2px 0 0 var(--shadow-c);
            transition: transform 0.12s var(--ease);
        }
        .color-swatch:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 var(--shadow-c); }
        .color-swatch.active { outline: 3px solid var(--green); outline-offset: 2px; }
        .color-swatch.white  { background: #ffffff; }
        .color-swatch.black  { background: #000000; }
        /* The Average swatch wears the picture's mean color (set by JS once
           an image is loaded / the crop changes). */
        .color-swatch.avg { background: var(--surface-2); }
        /* The Custom swatch's background is the current custom color
           (set by JS) — no conic rainbow wheel, that picker is gone. */

        /* Size slider */
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-ui);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 4px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 10px;
            border-radius: var(--r-pill);
            background: var(--surface-2);
            border: 2px solid var(--ink);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px; height: 26px;
            border-radius: 50%;
            background: var(--green);
            border: 3px solid var(--ink);
            cursor: pointer;
            box-shadow: 2px 2px 0 0 var(--shadow-c);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--green);
            border: 3px solid var(--ink);
            cursor: pointer;
        }

        .drag-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--ink-soft);
            text-align: center;
        }
        .drag-hint .material-icons-round { font-size: 16px; }

        /* Step navigation */
        .step-nav { display: flex; gap: 10px; margin-top: 16px; }
        .nav-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 14px;
            border: var(--border-w) solid var(--ink);
            border-radius: var(--r-md);
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.12s var(--ease), box-shadow 0.12s var(--ease);
            text-decoration: none;
        }
        .nav-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 0 var(--shadow-c); }
        .nav-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
        .nav-btn:disabled { opacity: 0.45; box-shadow: none; cursor: not-allowed; }
        .nav-btn .material-icons-round { font-size: 20px; }
        .nav-btn.primary { background: var(--green); color: var(--on-green); }
        .nav-btn.secondary { background: var(--surface); color: var(--ink); }

        .export-summary {
            text-align: center;
            font-size: 0.85rem;
            color: var(--ink-soft);
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* Color picker modal (kept from the previous version) */
        .color-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(18, 41, 26, 0.45);
            display: none;
            align-items: center; justify-content: center;
            z-index: 300;
            padding: 20px;
        }
        .color-modal-overlay.open { display: flex; }
        .color-modal-card {
            width: 100%;
            max-width: 340px;
            background: var(--surface);
            border: var(--border-w) solid var(--ink);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-lg);
            padding: 18px;
        }
        .color-modal-title {
            font-family: var(--font-display);
            margin: 0 0 14px;
            text-align: center;
        }
        /* ── Custom color picker (built in-house — the native
           <input type="color"> popup was inconsistent and ugly) ── */
        .cp-sv {
            position: relative;
            width: 100%;
            height: 148px;
            border: 2px solid var(--ink);
            border-radius: var(--r-md);
            cursor: crosshair;
            touch-action: none;          /* drag must not scroll the page */
            margin-bottom: 12px;
        }
        .cp-knob {
            position: absolute;
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px var(--ink);
            transform: translate(-50%, -50%);
            pointer-events: none;
            left: 50%; top: 50%;
        }
        /* Full hue spectrum on the track: red → yellow → green → cyan →
           blue → magenta → red. NOTE the doubled selector: the generic
           input[type="range"] styling above has higher specificity than a
           bare class, and it used to paint this track pale green. */
        input[type="range"].cp-hue {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 20px;
            border: 2px solid var(--ink);
            border-radius: var(--r-pill);
            outline: none;
            cursor: pointer;
            background: linear-gradient(to right,
                #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
            margin-bottom: 12px;
            padding: 0;
        }
        input[type="range"].cp-hue::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--ink);
            cursor: pointer;
            box-shadow: 2px 2px 0 0 var(--shadow-c);
        }
        input[type="range"].cp-hue::-moz-range-thumb {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--ink);
            cursor: pointer;
        }
        .cp-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .cp-preview {
            width: 40px; height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0 0 var(--shadow-c);
            background: #81C784;
        }
        #cp-hex {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            border: 2px solid var(--ink);
            border-radius: var(--r-md);
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--ink);
            background: var(--surface);
            text-transform: uppercase;
        }
        #cp-hex:focus { outline: 3px solid var(--green); outline-offset: 1px; }
        .cp-avg {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            padding: 10px 12px;
            background: var(--green-tint);
            border: 2px solid var(--ink);
            border-radius: var(--r-md);
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--ink);
            cursor: pointer;
            box-shadow: 2px 2px 0 0 var(--shadow-c);
        }
        .cp-avg:active { transform: translate(1px, 1px); box-shadow: none; }
        .cp-avg .material-icons-round { font-size: 18px; color: var(--green-text); }
        .recent-label {
            display: block;
            font-family: var(--font-ui);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .recent-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .recent-color {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            cursor: pointer;
        }
        .recent-color.empty { background: var(--surface-2); cursor: default; }
        .close-color-modal {
            width: 100%;
            padding: 12px;
            background: var(--green);
            color: var(--on-green);
            border: var(--border-w) solid var(--ink);
            border-radius: var(--r-md);
            font-family: var(--font-ui);
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: auto;              /* neutralise the global app toast's top (it would stretch this one) */
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(20px);
            background: var(--ink);
            color: #fff;
            padding: 12px 22px;
            border-radius: var(--r-pill);
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
            z-index: 400;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body id="wallpaper-page">

    <div id="app-container">
        <header style="padding: 12px 20px; flex-shrink: 0;">
            <button class="back-btn" onclick="window.location.href='settings'" style="display: flex; position: absolute; left: 20px; top: 50%; transform: translateY(-50%);" aria-label="Back to settings">
                <span class="material-icons-round" aria-hidden="true">arrow_back</span>
            </button>
            <h1 data-i18n="wp_title">Wallpaper Editor</h1>
        </header>

        <main>
            <div class="editor-container">
                <!-- Stepper: filled circles show where you are and what is left -->
                <div class="stepper" id="stepper" aria-hidden="true">
                    <div class="step-dot" data-dot="1">1</div>
                    <div class="step-line" data-line="1"></div>
                    <div class="step-dot" data-dot="2">2</div>
                    <div class="step-line" data-line="2"></div>
                    <div class="step-dot" data-dot="3">3</div>
                    <div class="step-line" data-line="3"></div>
                    <div class="step-dot" data-dot="4">4</div>
                </div>
                <div class="step-title" id="step-title" data-i18n="wp_step1">Picture</div>

                <!-- Shared live preview (canvas) — the wallpaper being edited -->
                <div class="preview-section" id="drop-zone">
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                    <canvas id="canvas-preview" width="1080" height="1440" tabindex="0" role="slider"
                            aria-label="Text vertical position" aria-orientation="vertical"
                            aria-valuemin="5" aria-valuemax="95" aria-valuenow="50"></canvas>
                    <div class="upload-overlay" id="upload-prompt" onclick="document.getElementById('image-input').click()">
                        <span class="material-icons-round upload-icon" aria-hidden="true">wallpaper</span>
                        <div class="upload-text" data-i18n="wp_upload">Tap to upload an image</div>
                        <div class="upload-hint" data-i18n="wp_drag">or drag and drop</div>
                    </div>
                    <button class="change-image-btn" id="change-btn" onclick="document.getElementById('image-input').click()">
                        <span class="material-icons-round" aria-hidden="true">edit</span>
                        <span data-i18n="wp_change">Change</span>
                    </button>
                </div>

                <!-- ── STEP 1: picture + aspect ratio ──────────────────── -->
                <section class="wstep active" id="wstep-1">
                    <div class="step-card">
                        <label class="control-label" data-i18n="wp_ratio">Aspect Ratio</label>
                        <div class="chip-row" id="ratio-row">
                            <button class="chip ratio-btn active" data-ratio="original" onclick="changeRatio('original', this)" data-i18n="wp_ratio_original">Original</button>
                            <button class="chip ratio-btn" data-ratio="phone" onclick="changeRatio('phone', this)" id="ratio-phone-btn">Phone</button>
                            <button class="chip ratio-btn" data-ratio="desktop" onclick="changeRatio('desktop', this)" data-i18n="wp_ratio_desktop">Computer</button>
                            <button class="chip ratio-btn" data-ratio="3:4" onclick="changeRatio('3:4', this)">3:4</button>
                        </div>

                        <div class="drag-hint" id="pan-hint" style="display: none;">
                            <span class="material-icons-round" aria-hidden="true">open_with</span>
                            <span data-i18n="wp_pan_hint">Drag the picture to choose which part is visible</span>
                        </div>

                        <div class="step-nav">
                            <button class="nav-btn primary" id="btn-next-1" onclick="gotoStep(2)" disabled>
                                <span data-i18n="wp_next">Next</span>
                                <span class="material-icons-round" aria-hidden="true">arrow_forward</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- ── STEP 2: typography (font, size, align, drag) ── -->
                <section class="wstep" id="wstep-2">
                    <div class="step-card">
                        <label class="control-label" data-i18n="wp_font">Font Style</label>
                        <div class="chip-row">
                            <button class="chip font-option playfair active" data-font="Playfair Display" onclick="changeFont('Playfair Display', this)" data-i18n="wp_f_classic">Classic</button>
                            <button class="chip font-option lato" data-font="Lato" onclick="changeFont('Lato', this)" data-i18n="wp_f_clean">Clean</button>
                            <button class="chip font-option caveat" data-font="Caveat" onclick="changeFont('Caveat', this)" data-i18n="wp_f_relaxed">Relaxed</button>
                            <button class="chip font-option merriweather" data-font="Merriweather" onclick="changeFont('Merriweather', this)" data-i18n="wp_f_elegant">Elegant</button>
                        </div>

                        <label class="control-label" data-i18n="wp_size">Text Size</label>
                        <div class="slider-labels">
                            <span data-i18n="wp_small">Small</span>
                            <span data-i18n="wp_large">Large</span>
                        </div>
                        <input type="range" id="font-size" min="20" max="80" value="40" aria-label="Text size">

                        <label class="control-label" data-i18n="wp_align">Text Alignment</label>
                        <div class="chip-row">
                            <button class="chip align-btn" data-align="left" onclick="changeAlign('left', this)" title="Left" data-i18n-title="wp_left">
                                <span class="material-icons-round" aria-hidden="true">format_align_left</span>
                            </button>
                            <button class="chip align-btn active" data-align="center" onclick="changeAlign('center', this)" title="Center" data-i18n-title="wp_center">
                                <span class="material-icons-round" aria-hidden="true">format_align_center</span>
                            </button>
                            <button class="chip align-btn" data-align="right" onclick="changeAlign('right', this)" title="Right" data-i18n-title="wp_right">
                                <span class="material-icons-round" aria-hidden="true">format_align_right</span>
                            </button>
                        </div>

                        <div class="drag-hint" id="drag-hint">
                            <span class="material-icons-round" aria-hidden="true">open_with</span>
                            <span data-i18n="wp_drag_hint">Drag the text on the picture to move it up or down</span>
                        </div>

                        <div class="step-nav">
                            <button class="nav-btn secondary" onclick="gotoStep(1)">
                                <span class="material-icons-round" aria-hidden="true">arrow_back</span>
                                <span data-i18n="wp_back">Back</span>
                            </button>
                            <button class="nav-btn primary" onclick="gotoStep(3)">
                                <span data-i18n="wp_next">Next</span>
                                <span class="material-icons-round" aria-hidden="true">arrow_forward</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- ── STEP 3: color, outline, automatic shadow ──────────
                     Order per spec: Text Color (4 circles) → Text Outline
                     (below color, above shadow) → Text Shadow, which is NO
                     LONGER a choice: light text always gets a black shadow,
                     dark text a white one — shown as a static indicator. -->
                <section class="wstep" id="wstep-3">
                    <div class="step-card">
                        <label class="control-label" data-i18n="wp_color">Text Color</label>
                        <div class="chip-row">
                            <button class="color-swatch white" type="button" aria-pressed="false" onclick="changeColorMode('white', this)" title="White" aria-label="White" data-i18n-title="wp_c_white"></button>
                            <button class="color-swatch black" type="button" aria-pressed="false" onclick="changeColorMode('black', this)" title="Black" aria-label="Black" data-i18n-title="wp_c_black"></button>
                            <button class="color-swatch avg" type="button" aria-pressed="false" onclick="changeColorMode('average', this)" title="Average color of the picture" aria-label="Average color of the picture" data-i18n-title="wp_c_avg"></button>
                            <button class="color-swatch custom" type="button" aria-pressed="false" onclick="openColorPicker()" title="Custom color" aria-label="Custom color" data-i18n-title="wp_c_custom"></button>
                        </div>

                        <label class="control-label" data-i18n="wp_outline">Text Outline</label>
                        <div class="chip-row" id="outline-row">
                            <button class="chip outline-btn active" data-outline="none" onclick="changeOutline('none', this)" data-i18n="wp_o_none">None</button>
                            <button class="chip outline-btn" data-outline="black" onclick="changeOutline('black', this)" data-i18n="wp_o_black">Black</button>
                            <button class="chip outline-btn" data-outline="white" onclick="changeOutline('white', this)" data-i18n="wp_o_white">White</button>
                        </div>

                        <label class="control-label" data-i18n="wp_shadow">Text Shadow</label>
                        <div class="chip-row">
                            <button class="chip shadow-auto active" id="shadow-auto-chip" type="button" disabled>Black</button>
                        </div>
                        <div class="ref-note" data-i18n="wp_shadow_auto">Automatic — follows the text color</div>

                        <div class="step-nav">
                            <button class="nav-btn secondary" onclick="gotoStep(2)">
                                <span class="material-icons-round" aria-hidden="true">arrow_back</span>
                                <span data-i18n="wp_back">Back</span>
                            </button>
                            <button class="nav-btn primary" onclick="gotoStep(4)">
                                <span data-i18n="wp_next">Next</span>
                                <span class="material-icons-round" aria-hidden="true">arrow_forward</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- ── STEP 4: save / share ────────────────────────────── -->
                <section class="wstep" id="wstep-4">
                    <div class="step-card">
                        <div class="export-summary" id="export-summary"></div>
                        <div class="step-nav">
                            <button class="nav-btn secondary" onclick="gotoStep(3)">
                                <span class="material-icons-round" aria-hidden="true">arrow_back</span>
                                <span data-i18n="wp_back">Back</span>
                            </button>
                            <button class="nav-btn primary" id="download-btn" onclick="downloadWallpaper()" disabled>
                                <span class="material-icons-round" aria-hidden="true">download</span>
                                <span data-i18n="wp_save">Save Wallpaper</span>
                            </button>
                            <button class="nav-btn primary" id="share-btn" onclick="shareWallpaper()" style="display: none;">
                                <span class="material-icons-round" aria-hidden="true">share</span>
                                <span data-i18n="wp_share">Share</span>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

        <!-- Color Picker Modal — custom-built: hue slider + saturation/
             brightness square + hex field + the picture's average color -->
    <div id="color-modal" class="color-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="color-modal-title" onclick="closeColorPicker(event)">
        <div class="color-modal-card" onclick="event.stopPropagation()">
            <h3 class="color-modal-title" id="color-modal-title" data-i18n="wp_pick">Pick a color</h3>

            <div class="cp-sv" id="cp-sv" aria-label="Saturation and brightness">
                <div class="cp-knob" id="cp-knob" aria-hidden="true"></div>
            </div>
            <input type="range" class="cp-hue" id="cp-hue" min="0" max="360" value="120" aria-label="Hue">

            <div class="cp-line">
                <span class="cp-preview" id="cp-preview" aria-hidden="true"></span>
                <input type="text" id="cp-hex" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#81C784" aria-label="Hex color value">
                <button type="button" class="cp-avg" id="cp-avg" data-i18n-title="wp_avg_title">
                    <span class="material-icons-round" aria-hidden="true">image_search</span>
                    <span data-i18n="wp_avg">Average</span>
                </button>
            </div>

            <div class="recent-colors">
                <span class="recent-label" data-i18n="wp_recent">Recent colors</span>
                <div class="recent-grid" id="recent-colors-grid"></div>
            </div>

            <button class="close-color-modal" onclick="closeColorPicker()" data-i18n="wp_done">Done</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toast-message">Wallpaper saved!</span>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // CREDO Wallpaper Editor — 4-step wizard
        //  1 Picture (upload, aspect ratio, DRAG TO PAN/CROP)   2
        //    Typography (font, size, alignment, italic reference, drag
        //    the TEXT)   3 Color (4 circles: white / black / average /
        //    custom + TEXT OUTLINE + AUTOMATIC shadow)   4 Save/share
        // Dragging is contextual: step 1 moves the PICTURE inside its
        // frame (which part stays visible), step 2 moves the TEXT
        // vertically, steps 3–4 are static. The custom color picker is
        // built in-house (hue slider + saturation/brightness square +
        // hex field) and offers the picture's average color as a
        // one-tap choice.
        // The reference ("- Luke 14:10") uses the same family, colour AND
        // alignment as the passage, italic and smaller; it joins the last
        // line when it fully fits, otherwise it drops to its own line.
        // Readability: light text always casts a BLACK shadow, dark text a
        // WHITE one — there is no shadow choice any more. An optional
        // outline (none / black / white) sits between color and shadow.
        // Last-used look is remembered in localStorage (wpEditorState);
        // readability (color) is auto-picked per image from the
        // brightness under the text until the user overrides it.
        // ═══════════════════════════════════════════════════════════════

        // Fallback Bible passages (same ids as data/bsb.bible.json)
        const fallbackQuotes = [
            {"id": 162, "text": "“Do not judge, or you will be judged.", "author": "Matthew 7:1"},
            {"id": 1, "text": "So they hurried off and found Mary and Joseph and the Baby, who was lying in the manger.", "author": "Luke 2:16"},
            {"id": 79, "text": "Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies.", "author": "John 11:25"}
        ];

        let currentQuotes = [];
        let currentQuote = null;
        let currentLang = 'en';
        let recentColors = JSON.parse(localStorage.getItem('recentColors') || '[]');

        // === WALLPAPER UI TEXTS (English — matches the app's en-only UI) ===
        const WPI18N = {
            en: {
                wp_title: 'Wallpaper Editor',
                wp_upload: 'Tap to upload an image', wp_drag: 'or drag and drop', wp_change: 'Change',
                wp_step1: '1 · Picture', wp_step2: '2 · Text & Layout', wp_step3: '3 · Color & Readability', wp_step4: '4 · Save',
                wp_next: 'Next', wp_back: 'Back',
                wp_ratio: 'Aspect Ratio',
                wp_ratio_original: 'Original', wp_ratio_desktop: 'Computer',
                wp_phone: 'Phone',
                wp_size: 'Text Size',
                wp_small: 'Small', wp_large: 'Large',
                wp_align: 'Text Alignment', wp_left: 'Left', wp_center: 'Center', wp_right: 'Right',
                wp_drag_hint: 'Drag the text on the picture to move it up or down',
                wp_font: 'Font Style',
                wp_f_classic: 'Classic', wp_f_clean: 'Clean', wp_f_relaxed: 'Relaxed', wp_f_elegant: 'Elegant',
                wp_color: 'Text Color', wp_c_white: 'White', wp_c_black: 'Black',
                wp_c_avg: 'Average color of the picture', wp_c_custom: 'Custom color',
                wp_outline: 'Text Outline', wp_o_none: 'None', wp_o_black: 'Black', wp_o_white: 'White',
                wp_shadow: 'Text Shadow', wp_shadow_auto: 'Automatic — follows the text color',
                wp_save: 'Save Wallpaper', wp_share: 'Share',
                wp_pick: 'Pick a color', wp_recent: 'Recent colors', wp_done: 'Done',
                wp_pan_hint: 'Drag the picture to choose which part is visible',
                wp_avg: 'Average', wp_avg_title: "Use the picture's average color",
                toast_saved_default: 'Wallpaper saved!',
                toast_image_loaded: 'Image loaded ({w}\u00D7{h})',
                toast_saved: 'Saved: {w}\u00D7{h}px',
                toast_shared: 'Shared!'
            }
        };

        function wpT(key) {
            const dict = WPI18N[currentLang] || WPI18N.en;
            return dict[key] || WPI18N.en[key] || key;
        }

        function applyWallpaperLanguage() {
            document.title = 'Wallpaper Editor – Credo';
            document.documentElement.lang = 'en';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (wpT(key) !== key) el.textContent = wpT(key);
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (wpT(key) !== key) el.setAttribute('title', wpT(key));
            });
        }

        // ── State ─────────────────────────────────────────────────────
        const canvas = document.getElementById('canvas-preview');
        const ctx = canvas.getContext('2d');

        let currentImage = null;      // Image object currently displayed
        let originalImage = null;     // same (kept name for export logic)
        let originalWidth = 0;
        let originalHeight = 0;
        let colorTouched = false;     // user picked color/outline for THIS image → auto-contrast stands down
        let imgAvgColor = null;       // mean color of the visible picture ("average" swatch)
        let dragHintDone = localStorage.getItem('wpDragHintSeen') === '1';
        let panHintDone = localStorage.getItem('wpPanHintSeen') === '1';

        // Picture pan (step 1): offset inside the cover-crop, each axis in
        // -1..1 where 0 is centered, -1 shows the left/top edge and 1 the
        // right/bottom edge. Not persisted — a new image starts centered.
        let imgPan = { x: 0, y: 0 };

        // Detected device aspect (max side / min side) for the Phone chip.
        let deviceRatio = 19.5 / 9;
        try {
            const sw = Math.max(screen.width || 0, screen.height || 0);
            const sh = Math.min(screen.width || 0, screen.height || 0);
            if (sw > 0 && sh > 0) deviceRatio = sw / sh;
        } catch (e) { /* keep default */ }

        function phoneExportSize() {
            // 1080 px wide, height follows the device aspect (cap 2400)
            return { w: 1080, h: Math.min(2400, Math.round(1080 * deviceRatio)) };
        }
        function ratioSpec(mode) {
            if (mode === 'original') return { w: originalWidth, h: originalHeight };
            if (mode === 'phone') return phoneExportSize();
            if (mode === 'desktop') return { w: 1920, h: 1080 };
            return { w: 1080, h: 1440 };   // '3:4'
        }

        const FONT_OPTIONS = ['Playfair Display', 'Lato', 'Caveat', 'Merriweather'];

        const DEFAULT_SETTINGS = {
            ratio: 'original',
            font: 'Playfair Display',
            fontSize: 40,
            align: 'center',
            top: 50,                    // vertical position in % (5..95)
            colorMode: 'white',         // 'white' | 'black' | 'average' | 'custom'
            customColor: '#81C784',
            outline: 'none'             // 'none' | 'black' | 'white'
            // NOTE: shadow is NOT a setting — it is derived from the text
            // color (light text → black shadow, dark text → white shadow).
            // The old refAlign / shadow / backdrop options are retired; any
            // leftovers in wpEditorState are deleted on load below.
        };
        let settings = loadSettings();

        function loadSettings() {
            try {
                const saved = JSON.parse(localStorage.getItem('wpEditorState') || '{}');
                delete saved.text;              // the passage always comes from the daily loader
                delete saved.refAlign;          // retired: reference follows the passage alignment
                delete saved.shadow;            // retired: shadow is derived from the text color
                delete saved.backdrop;          // retired: option removed
                // Fonts removed from the picker (e.g. Montserrat, Dancing
                // Script) must never resurrect themselves from storage.
                if (saved.font && !FONT_OPTIONS.includes(saved.font)) {
                    saved.font = DEFAULT_SETTINGS.font;
                }
                return Object.assign({}, DEFAULT_SETTINGS, saved);
            } catch (e) {
                return Object.assign({}, DEFAULT_SETTINGS);
            }
        }
        function persistSettings() {
            const copy = Object.assign({}, settings);
            delete copy.text;        // the passage is re-loaded fresh every day
            localStorage.setItem('wpEditorState', JSON.stringify(copy));
        }

        function effectiveColor() {
            if (settings.colorMode === 'custom') return settings.customColor;
            if (settings.colorMode === 'average') return imgAvgColor || '#808080';
            return settings.colorMode;      // 'white' | 'black'
        }

        // Relative luminance of the effective text color — drives the
        // AUTOMATIC shadow: light text gets a black shadow, dark text a
        // white one (user spec: no shadow choice any more).
        function textLuminance() {
            let hex = effectiveColor();
            // the plain modes are named colors, the helpers below want hex
            if (hex === 'white') hex = '#ffffff';
            else if (hex === 'black') hex = '#000000';
            const rgb = hexToRgb(hex) || [255, 255, 255];
            return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
        }
        function autoShadowColor() {
            return textLuminance() > 0.5 ? 'rgba(0,0,0,0.65)' : 'rgba(255,255,255,0.9)';
        }

        // ── Steps ─────────────────────────────────────────────────────
        const STEP_TITLES = { 1: 'wp_step1', 2: 'wp_step2', 3: 'wp_step3', 4: 'wp_step4' };
        let currentStep = 1;

        function gotoStep(n) {
            currentStep = n;
            for (let i = 1; i <= 4; i++) {
                document.getElementById('wstep-' + i).classList.toggle('active', i === n);
                const dot = document.querySelector('[data-dot="' + i + '"]');
                dot.classList.toggle('current', i === n);
                dot.classList.toggle('done', i < n);
                dot.innerHTML = i < n ? '<span class="material-icons-round" aria-hidden="true">check</span>' : String(i);
                if (i < 4) {
                    document.querySelector('[data-line="' + i + '"]').classList.toggle('filled', i < n);
                }
            }
            document.getElementById('step-title').textContent = wpT(STEP_TITLES[n]);
            document.getElementById('btn-next-1').disabled = !currentImage;
            // Dragging is contextual: step 1 pans the PICTURE, step 2 moves
            // the TEXT, steps 3–4 are static.
            syncCanvasDragMode();
            const m = document.querySelector('main');
            if (m) m.scrollTo({ top: 0 });
            if (n === 4) updateExportSummary();
        }

        function updateExportSummary() {
            const spec = ratioSpec(settings.ratio);
            const el = document.getElementById('export-summary');
            if (el) el.textContent = 'PNG · ' + spec.w + ' \u00D7 ' + spec.h + ' px · ' + settings.font;
        }

        // Canvas drag mode follows the step AND the presence of an image:
        // it must also be refreshed when a picture is uploaded while the
        // user is already sitting on step 1.
        function syncCanvasDragMode() {
            canvas.classList.toggle('can-pan', !!currentImage && currentStep === 1);
            canvas.classList.toggle('can-drag', !!currentImage && currentStep === 2);
            canvas.setAttribute('aria-label',
                currentStep === 1 ? 'Picture position' : 'Text vertical position');
        }

        // ── Daily passage (liturgical calendar first, date-hash fallback) ──
        let liturgicalDays = null;
        let calendarWrapYear = 2026;
        async function loadCalendar() {
            if (liturgicalDays) return;
            try {
                const response = await fetch('data/calendar.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Failed to load calendar');
                const data = await response.json();
                liturgicalDays = (data && data.days) ? data.days : {};
                calendarWrapYear = (data && data.wrapYear) || 2026;
            } catch (error) {
                console.warn('calendar.json could not be loaded — using date-hash selection.', error);
                liturgicalDays = {};
            }
        }

        async function loadDailyQuote() {
            try {
                const response = await fetch('data/bsb.bible.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Failed to load');
                const data = await response.json();
                currentQuotes = data.passages || [];
            } catch (error) {
                console.error('Could not load passages JSON:', error);
                currentQuotes = fallbackQuotes.slice();
            }
            await loadCalendar();

            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            const day = today.getDate();
            const pad = n => String(n).padStart(2, '0');
            const dateKey = `${year}-${pad(month + 1)}-${pad(day)}`;
            let quote = null;
            if (liturgicalDays) {
                let key = liturgicalDays[dateKey] ? dateKey : null;
                if (!key) {
                    let mm = pad(month + 1), dd = pad(day);
                    if (mm === '02' && dd === '29') dd = '28';
                    const wrapped = `${calendarWrapYear}-${mm}-${dd}`;
                    if (wrapped !== dateKey && liturgicalDays[wrapped]) key = wrapped;
                }
                if (key) quote = currentQuotes.find(q => q.id === liturgicalDays[key]);
            }
            if (!quote) {
                const seed = (year * 10000) + (month * 100) + day;
                quote = currentQuotes[seed % currentQuotes.length];
            }
            currentQuote = quote;
            // data/bsb.bible.json names the citation "ref"; the fallback
            // passages above use "author". Normalise so the canvas and the
            // share sheet can both rely on .author.
            if (currentQuote && !currentQuote.author) currentQuote.author = currentQuote.ref || '';
            settings.text = (currentQuote && currentQuote.text) || "";

            if (currentImage) drawCanvas();
        }

        // ── Image upload (tap / drag & drop) ──────────────────────────
        document.getElementById('image-input').addEventListener('change', handleImageUpload);
        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('upload-prompt').classList.add('drag-active');
        });
        dropZone.addEventListener('dragleave', () => document.getElementById('upload-prompt').classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('upload-prompt').classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) {
                document.getElementById('image-input').files = e.dataTransfer.files;
                handleImageUpload({ target: document.getElementById('image-input') });
            }
        });

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    originalImage = img;
                    currentImage = img;
                    colorTouched = false;          // fresh image → auto-contrast may pick again
                    imgPan = { x: 0, y: 0 };       // fresh image starts centered

                    setupCanvas();
                    refreshAverageColor();         // mean color for the "average" swatch
                    document.getElementById('upload-prompt').style.display = 'none';
                    document.getElementById('change-btn').classList.add('visible');
                    document.getElementById('download-btn').disabled = false;
                    document.getElementById('btn-next-1').disabled = false;   // picture ready → step 1 unlocked
                    if (!panHintDone) {
                        const ph = document.getElementById('pan-hint');
                        if (ph) ph.style.display = 'flex';
                    }
                    syncCanvasDragMode();          // picture ready → panning live on step 1

                    autoContrast();                 // pick readable color+shadow BEFORE first draw
                    drawCanvas();
                    showToast(wpT('toast_image_loaded').replace('{w}', originalWidth).replace('{h}', originalHeight));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ── Aspect ratio ──────────────────────────────────────────────
        function changeRatio(mode, element) {
            settings.ratio = mode;
            persistSettings();
            document.querySelectorAll('.ratio-btn').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            if (currentImage) {
                setupCanvas();
                refreshAverageColor();              // crop changed → mean color changed
                autoContrast();                     // crop changed → brightness under text changed
                drawCanvas();
            }
        }

        // Label the Phone chip with the DETECTED device aspect (e.g. "Phone 9:19.5")
        function initPhoneChipLabel() {
            const btn = document.getElementById('ratio-phone-btn');
            const ratioTxt = '9:' + (deviceRatio * 9).toFixed(1).replace(/\.0$/, '');
            btn.textContent = wpT('wp_phone') + ' ' + ratioTxt;
        }

        // ── Canvas sizing ─────────────────────────────────────────────
        function setupCanvas() {
            const spec = ratioSpec(settings.ratio);
            let w = spec.w, h = spec.h;
            const maxW = 1080, maxH = 1920;         // preview resolution cap
            if (w > maxW) { h = h * (maxW / w); w = maxW; }
            if (h > maxH) { w = w * (maxH / h); h = maxH; }
            canvas.width = Math.round(w);
            canvas.height = Math.round(h);
        }

        function drawCoverCrop(context, img, w, h) {
            const scale = Math.max(w / img.width, h / img.height);
            const sw = w / scale;
            const sh = h / scale;
            const ovX = img.width - sw;          // total horizontal overflow
            const ovY = img.height - sh;         // total vertical overflow
            // imgPan is -1..1 from the centered position; clamped so the
            // frame never shows empty space beyond the picture.
            const sx = ovX > 0 ? Math.min(ovX, Math.max(0, ovX / 2 + imgPan.x * ovX / 2)) : 0;
            const sy = ovY > 0 ? Math.min(ovY, Math.max(0, ovY / 2 + imgPan.y * ovY / 2)) : 0;
            context.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        }

        function drawCanvas() {
            if (!currentImage || !originalImage) return;
            renderInto(ctx, canvas.width, canvas.height);
        }

        // ── Text layout helpers (shared by preview + export) ──────────
        function wrapLines(c, text, maxWidth) {
            const words = text.split(' ');
            let line = '';
            const lines = [];
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (c.measureText(testLine).width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);
            return lines.map(l => l.trim());
        }

        // Row height the italic reference occupies when it drops to its own
        // line — a bit tighter than a passage line, so it hugs the text.
        function refLineH(fontPx) {
            return fontPx * 1.15;
        }

        // ── Core renderer (preview AND export use this one function) ──
        function renderInto(c, w, h) {
            // 1. picture
            c.clearRect(0, 0, w, h);
            if (settings.ratio === 'original') {
                c.drawImage(originalImage, 0, 0, w, h);
            } else {
                drawCoverCrop(c, originalImage, w, h);
            }
            if (!settings.text) return;

            // 2. text layout — layout(fp) computes the whole block for a
            //    main font size fp. AUTO-FIT: if the passage plus its
            //    reference cannot fit on the picture at the chosen size,
            //    the block is scaled down just enough to fit; the size
            //    slider remains the user's choice for everything that fits.
            const sidePad = 0.08 * w;               // fixed, margins removed by design
            const maxW = w - sidePad * 2;

            // ── Reference ("- Luke 14:10"): same family, colour AND
            //    alignment as the passage, italic and smaller. The whole
            //    reference is ONE unbreakable block: it joins the LAST line
            //    when it fully fits next to it, otherwise it drops to its
            //    own line under the same alignment.
            const refText = (currentQuote && currentQuote.author) ? '- ' + currentQuote.author : '';
            const REF_RATIO = 0.62;                 // reference size vs passage size
            const REF_GAP_RATIO = 0.45;             // gap vs reference size
            const refPxFor = (fp) => fp * REF_RATIO;
            const refGapFor = (fp) => fp * REF_RATIO * REF_GAP_RATIO;

            const layout = (fp) => {
                const mainFont = fp + 'px "' + settings.font + '"';
                c.font = mainFont;
                const ls = wrapLines(c, settings.text, maxW);
                const lh = fp * 1.3;
                const lws = ls.map(l => c.measureText(l).width);
                let rW = 0, rOwn = false;
                if (refText) {
                    c.font = 'italic ' + refPxFor(fp) + 'px "' + settings.font + '"';
                    rW = c.measureText(refText).width;
                    c.font = mainFont;
                    rOwn = (lws[ls.length - 1] + refGapFor(fp) + rW) > maxW;
                    if (!rOwn) {
                        // the last line becomes "text + gap + reference"
                        lws[ls.length - 1] += refGapFor(fp) + rW;
                    }
                }
                return {
                    ls, lh, lws, rW, rOwn,
                    blockH: ls.length * lh + (rOwn ? refLineH(fp) : 0)
                };
            };

            const sizeUnit = w / 400;
            let fontPx = settings.fontSize * sizeUnit;
            let lay = layout(fontPx);
            const maxBlockH = 0.92 * h;
            if (lay.blockH > maxBlockH) {
                fontPx = Math.max(12, fontPx * maxBlockH / lay.blockH);
                lay = layout(fontPx);
            }
            const lines = lay.ls;
            const lineHeight = lay.lh;
            const lineWs = lay.lws;
            const refW = lay.rW;
            const refOwnLine = lay.rOwn;
            const refPx = refPxFor(fontPx);
            const refGap = refGapFor(fontPx);

            // Left edge of a line of width lw for a given alignment.
            const lineX0 = (align, lw) =>
                align === 'left' ? sidePad
                : align === 'right' ? w - sidePad - lw
                : w / 2 - lw / 2;

            const blockH = lay.blockH;
            const centerY = (settings.top / 100) * h;
            const startY = centerY - blockH / 2 + lineHeight / 2;

            // 3. shadow + outline + text — every run is drawn left-anchored
            // at its computed x, so lines, the appended reference and the
            // own-line reference all share one alignment helper (lineX0).
            // Shadow color is AUTOMATIC: light text → black shadow, dark
            // text → white shadow (no user choice since v28).
            const shadowCol = autoShadowColor();
            c.shadowColor = shadowCol;
            c.shadowBlur = 8 * sizeUnit;
            c.shadowOffsetX = 2 * sizeUnit;
            c.shadowOffsetY = 2 * sizeUnit;
            c.fillStyle = effectiveColor();
            c.textAlign = 'left';
            c.textBaseline = 'middle';

            // Optional outline (stroke): drawn UNDER the fill — strokeText
            // with the shadow paints the silhouette + shadow, then the fill
            // goes on top WITHOUT a second shadow (which would double it).
            const outlineCol = settings.outline === 'black' ? '#000000'
                             : settings.outline === 'white' ? '#ffffff' : null;
            if (outlineCol) {
                c.strokeStyle = outlineCol;
                c.lineJoin = 'round';
                c.miterLimit = 2;
            }
            const drawRun = (txt, x, y, sizePx) => {
                if (outlineCol) {
                    c.lineWidth = Math.max(2, sizePx * 0.15);
                    c.strokeText(txt, x, y);
                    c.shadowColor = 'transparent';
                    c.shadowBlur = 0;
                    c.shadowOffsetX = 0;
                    c.shadowOffsetY = 0;
                    c.fillText(txt, x, y);
                    c.shadowColor = shadowCol;
                    c.shadowBlur = 8 * sizeUnit;
                    c.shadowOffsetX = 2 * sizeUnit;
                    c.shadowOffsetY = 2 * sizeUnit;
                } else {
                    c.fillText(txt, x, y);
                }
            };

            lines.forEach((lineText, i) => {
                drawRun(lineText, lineX0(settings.align, lineWs[i]), startY + (i * lineHeight), fontPx);
            });
            if (refText) {
                c.font = 'italic ' + refPx + 'px "' + settings.font + '"';
                if (refOwnLine) {
                    // snug on its own row below the passage — SAME alignment
                    // as the passage (per spec, no separate reference choice)
                    const refY = startY + (lines.length - 1) * lineHeight + (lineHeight + refLineH(fontPx)) / 2;
                    drawRun(refText, lineX0(settings.align, refW), refY, refPx);
                } else {
                    // appended after the last passage line, same baseline
                    const lastLw = lineWs[lines.length - 1] - refGap - refW;   // original text width
                    const refX = lineX0(settings.align, lineWs[lines.length - 1]) + lastLw + refGap;
                    drawRun(refText, refX, startY + (lines.length - 1) * lineHeight, refPx);
                }
            }
            c.shadowColor = 'transparent';
            c.shadowBlur = 0;
        }

        // ── AUTO READABILITY ──────────────────────────────────────────────
        // Measures the average brightness of the band where the text sits
        // and picks the default color: bright area → black text, dark area
        // → white text. The shadow follows automatically from the color
        // (light→black shadow, dark→white). It only fills the INITIAL value
        // and stands down the moment the user picks a color themselves
        // (colorTouched), or when there is a manual choice carried over for
        // this image.
        function autoContrast() {
            if (!currentImage || colorTouched) return;
            try {
                const s = document.createElement('canvas');
                s.width = 64; s.height = 100;
                const sc = s.getContext('2d');
                if (settings.ratio === 'original') {
                    sc.drawImage(originalImage, 0, 0, 64, 100);
                } else {
                    drawCoverCrop(sc, originalImage, 64, 100);
                }
                const y0 = Math.max(0, Math.round((settings.top / 100 - 0.18) * 100));
                const y1 = Math.min(100, Math.round((settings.top / 100 + 0.18) * 100));
                const band = sc.getImageData(0, y0, 64, Math.max(1, y1 - y0)).data;
                let lum = 0;
                for (let i = 0; i < band.length; i += 4) {
                    lum += 0.2126 * band[i] + 0.7152 * band[i + 1] + 0.0722 * band[i + 2];
                }
                lum = lum / (band.length / 4) / 255;
                settings.colorMode = lum > 0.55 ? 'black' : 'white';
                syncColorUI();
                if (typeof drawCanvas === 'function') drawCanvas();
            } catch (e) {
                console.warn('autoContrast failed:', e);
            }
        }

        // ── CANVAS DRAGGING (mouse / touch / pen via Pointer Events) ──
        // Step 1: drag pans the PICTURE inside its frame — the user picks
        // which part of the image stays visible and what gets cropped.
        // Step 2: drag moves the TEXT vertically. Steps 3–4: no dragging.
        let dragMode = null;             // 'pan' | 'text' | null
        let dragRaf = null;
        let panStart = null;             // { x, y, panX, panY }

        canvas.addEventListener('pointerdown', (e) => {
            if (!currentImage) return;
            if (currentStep === 1 && canvas.classList.contains('can-pan')) dragMode = 'pan';
            else if (currentStep === 2 && canvas.classList.contains('can-drag')) dragMode = 'text';
            else return;
            canvas.classList.add('dragging');
            try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic/invalid pointer */ }
            if (dragMode === 'pan') {
                panStart = { x: e.clientX, y: e.clientY, panX: imgPan.x, panY: imgPan.y };
            } else {
                updateTextDragFromPointer(e);
            }
            e.preventDefault();
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!dragMode) return;
            if (dragMode === 'pan') updatePanFromPointer(e);
            else updateTextDragFromPointer(e);
        });
        const endDrag = (e) => {
            if (!dragMode) return;
            const wasText = dragMode === 'text';
            const wasPan = dragMode === 'pan';
            dragMode = null;
            canvas.classList.remove('dragging');
            if (wasText) {
                persistSettings();
                if (!dragHintDone) {
                    dragHintDone = true;
                    localStorage.setItem('wpDragHintSeen', '1');
                    const hint = document.getElementById('drag-hint');
                    if (hint) hint.style.display = 'none';
                }
            }
            if (wasPan && !panHintDone) {
                panHintDone = true;
                localStorage.setItem('wpPanHintSeen', '1');
                const hint = document.getElementById('pan-hint');
                if (hint) hint.style.display = 'none';
            }
            try { if (e.pointerId !== undefined) canvas.releasePointerCapture(e.pointerId); } catch (err) {}
        };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);

        function updateTextDragFromPointer(e) {
            const rect = canvas.getBoundingClientRect();
            const frac = (e.clientY - rect.top) / rect.height;
            settings.top = Math.round(Math.min(95, Math.max(5, frac * 100)));
            canvas.setAttribute('aria-valuenow', settings.top);
            if (dragRaf) cancelAnimationFrame(dragRaf);
            dragRaf = requestAnimationFrame(() => { dragRaf = null; drawCanvas(); });
        }

        // Moving the pointer by one canvas width shifts the picture by one
        // visible width; the offset is stored as a fraction of the total
        // overflow so it survives ratio changes.
        function updatePanFromPointer(e) {
            if (!panStart || !originalImage) return;
            const rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const scale = Math.max(canvas.width / originalImage.width,
                                   canvas.height / originalImage.height);
            const ovX = originalImage.width - canvas.width / scale;
            const ovY = originalImage.height - canvas.height / scale;
            const dx = (e.clientX - panStart.x) * (canvas.width / rect.width) / scale;
            const dy = (e.clientY - panStart.y) * (canvas.height / rect.height) / scale;
            imgPan.x = ovX > 0 ? Math.min(1, Math.max(-1, panStart.panX - dx / (ovX / 2))) : 0;
            imgPan.y = ovY > 0 ? Math.min(1, Math.max(-1, panStart.panY - dy / (ovY / 2))) : 0;
            if (dragRaf) cancelAnimationFrame(dragRaf);
            dragRaf = requestAnimationFrame(() => { dragRaf = null; drawCanvas(); });
        }

        // Keyboard access to the same action (canvas is a role=slider)
        canvas.addEventListener('keydown', (e) => {
            if (currentStep !== 2 || !canvas.classList.contains('can-drag')) return;
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                settings.top = Math.min(95, Math.max(5, settings.top + (e.key === 'ArrowUp' ? -2 : 2)));
                canvas.setAttribute('aria-valuenow', settings.top);
                drawCanvas();
                persistSettings();
            }
        });

        // ── Typography controls ───────────────────────────────────────
        function changeFont(font, element) {
            settings.font = font;
            persistSettings();
            document.querySelectorAll('.font-option').forEach(el => {
                el.classList.remove('active');
                el.setAttribute('aria-pressed', 'false');
            });
            element.classList.add('active');
            element.setAttribute('aria-pressed', 'true');
            drawCanvas();
            ensureRefFontReady();
        }

        function changeAlign(align, element) {
            settings.align = align;
            persistSettings();
            document.querySelectorAll('.align-btn').forEach(el => {
                el.classList.remove('active');
                el.setAttribute('aria-pressed', 'false');
            });
            element.classList.add('active');
            element.setAttribute('aria-pressed', 'true');
            drawCanvas();
        }

        // Alignment of the reference always FOLLOWS the passage (per spec);
        // the separate reference-alignment option was removed.

        // Canvas does not trigger @font-face loads by itself: the italic face
        // used for the reference must be requested explicitly and the canvas
        // redrawn once it arrives (Caveat has no italic — the browser
        // synthesises the slant, which is fine).
        function ensureRefFontReady() {
            if (!(document.fonts && document.fonts.load)) return;
            document.fonts.load('italic 16px "' + settings.font + '"')
                .then(() => { if (currentImage) drawCanvas(); })
                .catch(() => {});
        }

        document.getElementById('font-size').addEventListener('input', (e) => {
            settings.fontSize = parseInt(e.target.value);
            persistSettings();
            drawCanvas();
        });

        // Sync chips/slider with the settings object (used on restore)
        function syncTypographyUI() {
            document.getElementById('font-size').value = settings.fontSize;
            document.querySelectorAll('.font-option').forEach(el => {
                const on = el.getAttribute('data-font') === settings.font;
                el.classList.toggle('active', on);
                el.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            document.querySelectorAll('.align-btn').forEach(el => {
                const on = el.getAttribute('data-align') === settings.align;
                el.classList.toggle('active', on);
                el.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
        }

        // ── Color / outline / automatic shadow controls ───────────
        function changeColorMode(mode, element) {
            settings.colorMode = mode;
            colorTouched = true;
            persistSettings();
            syncColorUI();
            drawCanvas();
        }

        // Outline: a stroke around the glyphs — none / black / white.
        // (Does NOT touch colorTouched: the outline says nothing about the
        // image brightness, so auto-contrast may still pick the color.)
        function changeOutline(mode, element) {
            settings.outline = mode;
            persistSettings();
            document.querySelectorAll('.outline-btn').forEach(el => {
                el.classList.remove('active');
                el.setAttribute('aria-pressed', 'false');
            });
            if (element) {
                element.classList.add('active');
                element.setAttribute('aria-pressed', 'true');
            }
            drawCanvas();
        }

        function syncColorUI() {
            // The Custom swatch wears the current custom color
            const customSwatch = document.querySelector('.color-swatch.custom');
            if (customSwatch) customSwatch.style.background = settings.customColor;
            // The Average swatch wears the picture's mean color
            const avgSwatch = document.querySelector('.color-swatch.avg');
            if (avgSwatch) avgSwatch.style.background = imgAvgColor || '';
            document.querySelectorAll('.color-swatch').forEach(el => {
                const mode = el.classList.contains('white') ? 'white'
                           : el.classList.contains('black') ? 'black'
                           : el.classList.contains('avg') ? 'average' : 'custom';
                const on = settings.colorMode === mode;
                el.classList.toggle('active', on);
                el.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            updateAutoShadowUI();
        }

        function syncOutlineUI() {
            document.querySelectorAll('.outline-btn').forEach(el => {
                const on = el.getAttribute('data-outline') === settings.outline;
                el.classList.toggle('active', on);
                el.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
        }

        // The shadow chip is an indicator, not a choice: it always shows the
        // automatically picked shadow color for the current text color.
        function updateAutoShadowUI() {
            const chip = document.getElementById('shadow-auto-chip');
            if (!chip) return;
            chip.textContent = wpT(textLuminance() > 0.5 ? 'wp_o_black' : 'wp_o_white');
            chip.classList.add('active');
        }

        // Mean color of the whole visible picture — recomputed whenever the
        // image or the crop changes; worn by the "average" swatch.
        function refreshAverageColor() {
            imgAvgColor = averageImageColor();
        }

        // ── Custom color picker (in-house) ────────────────────────────
        // Hue slider + saturation/brightness square + hex field + the
        // picture's average color as a one-tap choice. Replaces the
        // native <input type="color"> popup entirely.
        let lastColorTrigger = null;
        let cpState = { h: 99, s: 0.40, v: 0.78 };   // HSV of the default green
        let cpOpenColor = null;                      // color when the modal opened
        let cpRaf = null;
        const cpSv = document.getElementById('cp-sv');
        const cpKnob = document.getElementById('cp-knob');
        const cpHue = document.getElementById('cp-hue');
        const cpHex = document.getElementById('cp-hex');
        const cpPreview = document.getElementById('cp-preview');
        const cpAvgBtn = document.getElementById('cp-avg');

        function hsvToRgb(h, s, v) {
            const f = n => {
                const k = (n + h / 60) % 6;
                return v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
            };
            return [Math.round(f(5) * 255), Math.round(f(3) * 255), Math.round(f(1) * 255)];
        }
        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }
        function hexToRgb(hex) {
            const m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
            if (!m) return null;
            const n = parseInt(m[1], 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            let h = 0;
            if (d) {
                if (max === r) h = ((g - b) / d) % 6;
                else if (max === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h *= 60;
                if (h < 0) h += 360;
            }
            return { h, s: max ? d / max : 0, v: max };
        }

        function applyCustomColor(hex) {
            settings.colorMode = 'custom';
            settings.customColor = hex;
            colorTouched = true;
            persistSettings();
            syncColorUI();
            drawCanvas();
        }

        // Push the current HSV state into the settings and the picker UI
        function cpApply() {
            const [r, g, b] = hsvToRgb(cpState.h, cpState.s, cpState.v);
            applyCustomColor(rgbToHex(r, g, b));
            cpSyncUI();
        }

        function cpSyncUI() {
            const hex = settings.customColor;
            cpPreview.style.background = hex;
            if (document.activeElement !== cpHex) cpHex.value = hex;
            cpSv.style.background =
                'linear-gradient(to top, #000, rgba(0,0,0,0)), ' +
                'linear-gradient(to right, #fff, rgba(255,255,255,0)), ' +
                'hsl(' + Math.round(cpState.h) + ', 100%, 50%)';
            cpKnob.style.left = (cpState.s * 100) + '%';
            cpKnob.style.top = ((1 - cpState.v) * 100) + '%';
            if (document.activeElement !== cpHue) cpHue.value = Math.round(cpState.h);
        }

        function cpApplySoon() {
            if (cpRaf) cancelAnimationFrame(cpRaf);
            cpRaf = requestAnimationFrame(() => { cpRaf = null; cpApply(); });
        }

        // SV square: pointer position = saturation (x) and brightness (y)
        let cpDragging = false;
        cpSv.addEventListener('pointerdown', (e) => {
            cpDragging = true;
            try { cpSv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic/invalid pointer */ }
            cpSvFromEvent(e);
            e.preventDefault();
        });
        cpSv.addEventListener('pointermove', (e) => { if (cpDragging) cpSvFromEvent(e); });
        ['pointerup', 'pointercancel'].forEach(t =>
            cpSv.addEventListener(t, () => { cpDragging = false; }));
        function cpSvFromEvent(e) {
            const r = cpSv.getBoundingClientRect();
            cpState.s = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
            cpState.v = 1 - Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
            cpApplySoon();
        }

        cpHue.addEventListener('input', () => {
            cpState.h = parseInt(cpHue.value, 10) || 0;
            cpApplySoon();
        });

        cpHex.addEventListener('change', () => {
            const rgb = hexToRgb(cpHex.value);
            if (rgb) {
                cpState = rgbToHsv(rgb[0], rgb[1], rgb[2]);
                cpApply();
            } else {
                cpHex.value = settings.customColor;    // invalid input → revert
            }
        });
        cpHex.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); cpHex.blur(); }
        });

        // One-tap "Average": the mean color of the WHOLE visible picture
        cpAvgBtn.addEventListener('click', () => {
            const hex = averageImageColor();
            if (!hex) return;
            const rgb = hexToRgb(hex);
            cpState = rgbToHsv(rgb[0], rgb[1], rgb[2]);
            cpApply();
        });

        function averageImageColor() {
            if (!originalImage) return null;
            try {
                const s = document.createElement('canvas');
                s.width = 32; s.height = 32;
                const sc = s.getContext('2d');
                if (settings.ratio === 'original') {
                    sc.drawImage(originalImage, 0, 0, 32, 32);
                } else {
                    drawCoverCrop(sc, originalImage, 32, 32);
                }
                const d = sc.getImageData(0, 0, 32, 32).data;
                let r = 0, g = 0, b = 0;
                const n = d.length / 4;
                for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
                return rgbToHex(Math.round(r / n), Math.round(g / n), Math.round(b / n));
            } catch (e) {
                console.warn('averageImageColor failed:', e);
                return null;
            }
        }

        function openColorPicker() {
            lastColorTrigger = document.activeElement;
            const rgb = hexToRgb(settings.customColor) || [129, 199, 132];
            cpState = rgbToHsv(rgb[0], rgb[1], rgb[2]);
            cpOpenColor = settings.customColor;
            updateRecentColorsDisplay();
            cpSyncUI();
            const modal = document.getElementById('color-modal');
            modal.classList.add('open');
            const done = modal.querySelector('.close-color-modal');
            if (done) setTimeout(() => done.focus(), 80);
        }

        function closeColorPicker(e) {
            const isDoneBtn = e && e.target && e.target.closest && e.target.closest('.close-color-modal');
            if (!e || e.target.id === 'color-modal' || isDoneBtn) {
                const modal = document.getElementById('color-modal');
                modal.classList.remove('open');
                // One recents entry per picker session, not per drag frame
                if (settings.colorMode === 'custom' && settings.customColor !== cpOpenColor) {
                    addToRecentColors(settings.customColor);
                    updateRecentColorsDisplay();
                }
                cpOpenColor = null;
                if (lastColorTrigger && typeof lastColorTrigger.focus === 'function') lastColorTrigger.focus();
                lastColorTrigger = null;
            }
        }
