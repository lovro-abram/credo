    <style>
        :root {
            --base-font-size: 16px;
            --quote-font-size: 1.6rem;
        }
        
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-size: var(--base-font-size);
        }
        
        #wallpaper-page {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        
        #wallpaper-page #app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        #wallpaper-page main {
            flex: 1;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        
        /* Preview Section */
        .preview-section {
            flex: 0 0 45%;
            position: relative;
            background: var(--surface-color);
            margin: 15px 20px 10px 20px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            min-height: 200px;
        }
        
        #canvas-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%), 
                        linear-gradient(-45deg, rgba(0,0,0,0.1) 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.1) 75%), 
                        linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.1) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: rgba(0,0,0,0.05);
            display: block;
        }
        
        .upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            border: 2px dashed var(--surface-light);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s, transform 0.2s var(--ease);
        }
        
        .upload-overlay:hover, .upload-overlay.drag-active {
            border-color: var(--accent-color);
            background: var(--surface-light);
        }
        
        .upload-icon {
            font-size: 48px;
            color: var(--accent-color);
            margin-bottom: 15px;
            opacity: 0.8;
        }
        
        .upload-text {
            color: var(--text-secondary);
            text-align: center;
            padding: 0 20px;
            font-size: 0.95rem;
        }
        
        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-top: 8px;
        }
        
        .change-image-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 10;
            transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }
        
        .change-image-btn.visible {
            display: flex;
        }
        
        .change-image-btn:active {
            transform: scale(0.95);
        }
        
        .image-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            padding: 4px 8px;
            font-size: 0.7rem;
            display: none;
        }
        
        .image-info.visible {
            display: block;
        }
        
        /* Controls Section */
        .controls-section {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            padding: 10px 20px 40px 20px;
        }
        
        .controls-section::-webkit-scrollbar {
            display: none;
        }
        
        .control-group {
            margin-bottom: 16px;
            background: var(--surface-color);
            padding: 14px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(18,41,26,0.08);
            flex-shrink: 0;
        }
        
        .control-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        
        /* Font Selector */
        .font-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .font-option {
            padding: 10px 4px;
            background: var(--surface-light);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.12s var(--ease);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            tap-highlight-color: transparent;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-option.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(129, 199, 132, 0.15);
        }
        
        .font-option.playfair { font-family: 'Playfair Display', serif; font-size: 0.9rem; }
        .font-option.lato { font-family: 'Lato', sans-serif; }
        .font-option.caveat { font-family: 'Caveat', cursive; font-size: 1rem; }
        .font-option.montserrat { font-family: 'Montserrat', sans-serif; font-weight: 600; }
        .font-option.merriweather { font-family: 'Merriweather', serif; font-size: 0.75rem; }
        .font-option.dancing { font-family: 'Dancing Script', cursive; font-size: 1rem; }
        
        /* Color Section */
        .color-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .color-swatch {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.12s var(--ease), border-color 0.2s, box-shadow 0.2s;
            position: relative;
            box-shadow: 0 2px 6px rgba(18,41,26,0.2);
            flex-shrink: 0;
        }
        
        .color-swatch.active {
            border-color: var(--accent-color);
            transform: scale(1.1);
            box-shadow: 0 0 0 2px var(--surface-color), 0 0 0 4px var(--accent-color);
        }
        
        .color-swatch.white { background: #ffffff; }
        .color-swatch.black { background: #000000; }
        
        .color-wheel {
            background: conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            position: relative;
            overflow: hidden;
        }
        
        .color-wheel::after {
            content: 'colorize';
            font-family: 'Material Icons Round';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        
        /* Color Picker Modal */
        .color-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: rgba(18, 41, 26, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        
        .color-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        
        .color-modal-card {
            background: var(--surface-color);
            width: 100%;
            max-width: 320px;
            border-radius: var(--radius-xl);
            padding: 25px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .color-modal-overlay.open .color-modal-card {
            transform: scale(1);
        }
        
        .color-modal-title {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin: 0 0 20px 0;
            text-align: center;
            font-family: var(--font-quote);
        }
        
        .color-input-wrapper {
            position: relative;
            width: 100%;
            height: 50px;
            margin-bottom: 20px;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
        }
        
        #color-picker-input {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            padding: 0;
            margin: 0;
            cursor: pointer;
            border: none;
        }
        
        .color-input-label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-light);
            color: var(--text-secondary);
            font-weight: 600;
            pointer-events: none;
            border-radius: var(--radius-md);
        }
        
        .recent-colors {
            margin-bottom: 20px;
        }
        
        .recent-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
        }
        
        .recent-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .recent-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(18,41,26,0.25);
            transition: transform 0.2s;
            box-shadow: 0 2px 4px rgba(18,41,26,0.15);
        }
        
        .recent-color:active {
            transform: scale(0.9);
        }
        
        .recent-color.empty {
            background: var(--surface-light);
            border: 2px dashed var(--text-secondary);
            opacity: 0.3;
        }
        
        .close-color-modal {
            width: 100%;
            padding: 14px;
            background: var(--surface-light);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 1rem;
            touch-action: manipulation;
        }
        
        /* Sliders */
        .slider-container {
            margin-bottom: 8px;
        }
        
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--surface-light);
            outline: none;
            margin: 6px 0;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(18,41,26,0.25);
            border: 2px solid var(--bg-color);
            transition: transform 0.1s;
        }
        
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        
        /* Reversed slider for Right Margin */
        input[type="range"].reversed {
            direction: rtl;
        }
        
        /* Lock Button */
        .lock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -5px 0 10px 0;
        }
        
        .lock-btn {
            background: rgba(129, 199, 132, 0.2);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s var(--ease), background-color 0.2s, color 0.2s;
            font-size: 18px;
        }
        
        .lock-btn.unlocked {
            background: var(--surface-light);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            opacity: 0.5;
        }
        
        .lock-btn:active {
            transform: scale(0.9);
        }
        
        /* Alignment */
        .alignment-row {
            display: flex;
            gap: 10px;
        }
        
        .align-btn {
            flex: 1;
            height: 44px;
            background: var(--surface-light);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s, transform 0.12s var(--ease);
            touch-action: manipulation;
        }
        
        .align-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(129, 199, 132, 0.15);
        }
        
        .align-btn .material-icons-round {
            font-size: 22px;
        }
        
        /* Aspect Ratio Buttons */
        .ratio-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .ratio-btn {
            background: var(--surface-light);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
            font-family: var(--font-ui);
            touch-action: manipulation;
        }
        
        .ratio-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(129, 199, 132, 0.15);
        }
        
        .ratio-hint {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 8px;
            padding-left: 4px;
        }
        
        /* Download Button */
        .download-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 16px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px auto 30px auto;
            transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
            text-transform: uppercase;
            letter-spacing: 0;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            pointer-events: none;
        }
        
        .download-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 1px 1px 0 0 var(--shadow-c);
        }
        
        .download-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--surface-light);
            color: var(--text-secondary);
            box-shadow: none;
        }
        
        .download-btn .material-icons-round {
            font-size: 20px;
        }
        
        #wallpaper-page .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            z-index: 2000;
        }
        
        #wallpaper-page .bottom-nav {
            display: none;
        }
        
        @media (min-width: 768px) {
            .preview-section {
                flex: 0 0 50%;
            }
            
            .controls-section {
                padding-bottom: 20px;
            }
            
            .download-btn {
                width: auto;
                min-width: 250px;
            }
        }
        
        @media (max-height: 600px) {
            .preview-section {
                flex: 0 0 40%;
                margin: 10px 15px 5px 15px;
            }
            
            .control-group {
                padding: 10px;
                margin-bottom: 8px;
            }
            
            .controls-section {
                padding: 5px 15px 20px 15px;
            }
        }
        /* ── Neo-brutal overlay (v3, light-only) — harmonises editor chrome with the shared tokens ── */
        html, body { overflow-x: clip; }

        .preview-section,
        .editor-container .control-group,
        .color-modal-card {
            border: var(--border-w) solid var(--ink);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-md);
            background: var(--surface);
        }

        .upload-overlay {
            border: 2px dashed var(--ink);
            background: var(--surface);
            border-radius: var(--r-xl);
        }
        .upload-overlay:hover,
        .upload-overlay.drag-active {
            background: var(--surface-2);
            border-color: var(--ink);
        }

        .change-image-btn,
        .lock-btn,
        .ratio-btn,
        .font-option,
        .align-btn,
        .close-color-modal {
            border: 2px solid var(--ink);
            border-radius: var(--r-md);
            background: var(--surface-2);
            color: var(--ink);
            box-shadow: 2px 2px 0 0 var(--shadow-c);
            transition: transform 0.12s var(--ease), box-shadow 0.12s var(--ease);
        }

        .change-image-btn:hover,
        .ratio-btn:hover,
        .font-option:hover,
        .align-btn:hover,
        .close-color-modal:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 var(--shadow-c); }

        .ratio-btn.active,
        .font-option.active,
        .align-btn.active {
            background: var(--green);
            color: var(--on-green);
            border-color: var(--ink);
        }

        .download-btn {
            border: var(--border-w) solid var(--ink);
            border-radius: var(--r-md);
            background: var(--green);
            color: var(--on-green);
            font-weight: 700;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
        }

        .download-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 0 var(--shadow-c); }
        .download-btn:disabled { opacity: 0.45; box-shadow: none; cursor: not-allowed; }

        .image-info,
        .ratio-hint {
            background: var(--gold-tint);
            border: 2px solid var(--ink);
            border-radius: var(--r-md);
            color: var(--ink);
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        /* v12 a11y: font/color/align controls are real <button>s now — strip UA chrome */
        .font-option, .color-swatch, .align-btn {
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }
        .color-swatch { padding: 0; }
    </style>
</head>
<body id="wallpaper-page">

    <div id="app-container">
        <header style="padding: 12px 20px; flex-shrink: 0;">
            <button class="back-btn" onclick="window.location.href='settings'" style="display: flex; position: absolute; left: 20px; top: 50%; transform: translateY(-50%);" aria-label="Back to settings">
                <span class="material-icons-round" aria-hidden="true">arrow_back</span>
            </button>
            <h1 data-i18n="wp_title">Wallpaper Editor</h1>
        </header>

        <main>
            <div class="editor-container">
                <!-- Top: Preview -->
                <div class="preview-section" id="drop-zone">
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                    <canvas id="canvas-preview"></canvas>
                    <div class="upload-overlay" id="upload-prompt" onclick="document.getElementById('image-input').click()">
                        <span class="material-icons-round upload-icon">wallpaper</span>
                        <div class="upload-text" data-i18n="wp_upload">Tap to upload an image</div>
                        <div class="upload-hint" data-i18n="wp_drag">or drag and drop</div>
                    </div>
                    <button class="change-image-btn" id="change-btn" onclick="document.getElementById('image-input').click()">
                        <span class="material-icons-round" style="font-size: 18px;">edit</span>
                        <span data-i18n="wp_change">Change</span>
                    </button>
                    <div class="image-info" id="image-info"></div>
                </div>

                <!-- Bottom: Controls -->
                <div class="controls-section">
                    <!-- 0. Aspect Ratio -->
                    <div class="control-group" style="margin-bottom: 12px;">
                        <label class="control-label" data-i18n="wp_ratio">Aspect Ratio</label>
                        <div class="ratio-row">

                            <button class="ratio-btn" data-ratio="9:16" onclick="changeRatio('9:16', this)" data-i18n="wp_ratio_story">9:16 Story</button>
                            <button class="ratio-btn" data-ratio="9:19.5" onclick="changeRatio('9:19.5', this)" data-i18n="wp_ratio_phone">9:19.5 Phone</button>

                    </div>

                    <!-- 1. Font Size -->
                    <div class="control-group" style="margin-bottom: 12px;">
                        <div class="slider-labels">

                    <!-- 2. Text Alignment -->
                    <div class="control-group" style="margin-bottom: 12px;">
                        <label class="control-label" data-i18n="wp_align">Text Alignment</label>
                        <div class="alignment-row">
                            <button class="align-btn" onclick="changeAlign('left', this)" title="Left" data-i18n-title="wp_left">
                                <span class="material-icons-round" aria-hidden="true">format_align_left</span>

                            <button class="align-btn active" onclick="changeAlign('center', this)" title="Center" data-i18n-title="wp_center">
                                <span class="material-icons-round" aria-hidden="true">format_align_center</span>
                            </button>
                            <button class="align-btn" onclick="changeAlign('right', this)" title="Right" data-i18n-title="wp_right">
                                <span class="material-icons-round" aria-hidden="true">format_align_right</span>
                            </button>

                    <!-- 3. Vertical Position -->
                    <div class="control-group" style="margin-bottom: 12px;">
                        <label class="control-label" data-i18n="wp_vertical">Vertical Position</label>
                        <div class="slider-labels">
                            <span data-i18n="wp_top">Top</span>
                            <span id="top-val">50%</span>
                            <span data-i18n="wp_bottom">Bottom</span>
                        </div>
                        <input type="range" id="top-offset" min="5" max="95" value="50">

                    <!-- 4. Left & Right Margins -->
                    <div class="control-group" style="margin-bottom: 12px;">
                        <div class="lock-container">
                            <button class="lock-btn" id="lock-btn" onclick="toggleLock()" title="Lock margins together" data-i18n-title="wp_lock">
                                <span class="material-icons-round" id="lock-icon">lock</span>
                            </button>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div>
                                <div class="slider-labels">
                                    <span data-i18n="wp_left_margin">Left margin</span>
                                    <span id="left-val">10%</span>
                                </div>
                                <input type="range" id="left-offset" min="0" max="40" value="10">
                            </div>
                            <div>
                                <div class="slider-labels">
                                    <span data-i18n="wp_right_margin">Right margin</span>
                                    <span id="right-val">10%</span>
                                </div>
                                <!-- Reversed: 0 on right, 40 on left visually -->

                            </div>
                        </div>

                    <!-- 5. Font Selection -->
                    <div class="control-group" style="margin-bottom: 12px;">
                        <label class="control-label" data-i18n="wp_font">Font Style</label>
                        <div class="font-selector">
                            <button class="font-option playfair active" type="button" aria-pressed="true" onclick="changeFont('Playfair Display', this)" data-i18n="wp_f_classic">Classic</button>
                            <button class="font-option lato" type="button" aria-pressed="false" onclick="changeFont('Lato', this)" data-i18n="wp_f_clean">Clean</button>
                            <button class="font-option caveat" type="button" aria-pressed="false" onclick="changeFont('Caveat', this)" data-i18n="wp_f_relaxed">Relaxed</button>
                            <button class="font-option montserrat" type="button" aria-pressed="false" onclick="changeFont('Montserrat', this)" data-i18n="wp_f_modern">Modern</button>
                            <button class="font-option merriweather" type="button" aria-pressed="false" onclick="changeFont('Merriweather', this)" data-i18n="wp_f_elegant">Elegant</button>
                            <button class="font-option dancing" type="button" aria-pressed="false" onclick="changeFont('Dancing Script', this)" data-i18n="wp_f_script">Handwriting</button>

                    <!-- 6. Color Selection (Last) -->
                    <div class="control-group" style="margin-bottom: 16px;">

                        <div class="color-row">

                            <button class="color-swatch black" type="button" aria-pressed="false" onclick="changeColor('#000000', this)" title="Black" aria-label="Black" data-i18n-title="wp_c_black"></button>

                        </div>

                    <!-- Download Button -->
                    <button class="download-btn" id="download-btn" onclick="downloadWallpaper()" disabled>
                        <span class="material-icons-round" aria-hidden="true">download</span>

    <!-- Color Picker Modal -->
    <div id="color-modal" class="color-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="color-modal-title" onclick="closeColorPicker(event)">
        <div class="color-modal-card" onclick="event.stopPropagation()">
            <h3 class="color-modal-title" id="color-modal-title" data-i18n="wp_pick">Pick a color</h3>
            
            <div class="color-input-wrapper" onclick="document.getElementById('color-picker-input').click()">
                <input type="color" id="color-picker-input" onchange="handleColorPick(this.value)">
                <div class="color-input-label" id="current-color-display" style="background: #81C784;" data-i18n="wp_choose">
                    Tap to choose a color
                </div>
            </div>
            
            <div class="recent-colors">
                <span class="recent-label" data-i18n="wp_recent">Recent colors</span>
                <div class="recent-grid" id="recent-colors-grid">
                    <div class="recent-color empty"></div>
                    <div class="recent-color empty"></div>
                    <div class="recent-color empty"></div>
                    <div class="recent-color empty"></div>
                    <div class="recent-color empty"></div>
                    <div class="recent-color empty"></div>
                </div>
            </div>
            
            <button class="close-color-modal" onclick="closeColorPicker()" data-i18n="wp_done">Done</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <span class="material-icons-round toast-icon">check_circle</span>
        <span id="toast-message">Wallpaper saved!</span>
    </div>

    <script>
        // Fallback Bible passages (same ids as data/bsb.bible.json)
        const fallbackQuotes = [
            {"id": 162, "text": "“Do not judge, or you will be judged.", "author": "Matthew 7:1"},
            {"id": 1, "text": "So they hurried off and found Mary and Joseph and the Baby, who was lying in the manger.", "author": "Luke 2:16"},
            {"id": 79, "text": "Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies.", "author": "John 11:25"}
        ];
        
        let currentQuotes = [];
        let currentQuote = null;
        // English-only app
        let currentLang = 'en';
        let recentColors = JSON.parse(localStorage.getItem('recentColors') || '[]');
        let marginsLocked = true;
        
        // === WALLPAPER UI TEXTS (English) ===
        const WPI18N = {
            en: {
                wp_title: 'Wallpaper Editor',
                wp_upload: 'Tap to upload an image', wp_drag: 'or drag and drop', wp_change: 'Change',
                wp_ratio: 'Aspect Ratio',
                wp_ratio_original: 'Original', wp_ratio_story: '9:16 Story', wp_ratio_phone: '9:19.5 Phone', wp_ratio_desktop: '16:9 Desktop',
                hint_original: 'Keep the original aspect ratio of the uploaded image.',
                hint_export: 'Export: {w} \u00D7 {h} px (image is center-cropped).',
                wp_small: 'Small', wp_medium: 'Medium', wp_large: 'Large',
                wp_align: 'Text Alignment', wp_left: 'Left', wp_center: 'Center', wp_right: 'Right',
                wp_vertical: 'Vertical Position', wp_top: 'Top', wp_bottom: 'Bottom',
                wp_lock: 'Lock margins together', wp_left_margin: 'Left margin', wp_right_margin: 'Right margin',
                wp_font: 'Font Style',
                wp_f_classic: 'Classic', wp_f_clean: 'Clean', wp_f_relaxed: 'Relaxed', wp_f_modern: 'Modern', wp_f_elegant: 'Elegant', wp_f_script: 'Handwriting',
                wp_color: 'Text Color', wp_c_white: 'White', wp_c_black: 'Black', wp_c_custom: 'Custom color',
                wp_save: 'Save Wallpaper',
                wp_pick: 'Pick a color', wp_choose: 'Tap to choose a color', wp_recent: 'Recent colors', wp_done: 'Done',
                toast_saved_default: 'Wallpaper saved!',
                toast_image_loaded: 'Image loaded ({w}\u00D7{h})',
                toast_saved: 'Saved: {w}\u00D7{h}px',
                toast_color: 'Color updated'
            }
        };
        
        function wpT(key) {
            const dict = WPI18N[currentLang] || WPI18N.en;
            return dict[key] || WPI18N.en[key] || key;
        }
        
        // Apply the English texts to all static wallpaper UI elements
        function applyWallpaperLanguage() {
            document.title = 'Wallpaper Editor – Credo';
            document.documentElement.lang = 'en';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (wpT(key) !== key) el.textContent = wpT(key);
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (wpT(key) !== key) el.setAttribute('title', wpT(key));
            });
            // Default slider value label (size-val is dynamic afterwards)
            const sizeVal = document.getElementById('size-val');
            if (sizeVal) sizeVal.textContent = wpT('wp_medium');
            // Ratio hint matches the current mode
            updateRatioHint();
        }
        
        function updateRatioHint() {
            const hint = document.getElementById('ratio-hint');
            if (!hint) return;
            if (ratioMode === 'original') {
                hint.textContent = wpT('hint_original');
            } else {
                const p = RATIO_PRESETS[ratioMode];
                hint.textContent = wpT('hint_export').replace('{w}', p.w).replace('{h}', p.h);
            }
        }
        
        // Store original image and dimensions
        let currentImage = null;
        let originalImage = null;
        let originalWidth = 0;
        let originalHeight = 0;
        
        let settings = {
            text: '',
            font: 'Playfair Display',
            color: '#ffffff',
            align: 'center',
            top: 50,
            leftOffset: 10,
            rightOffset: 10,
            fontSize: 40,
            shadow: true
        };

        const canvas = document.getElementById('canvas-preview');
        const ctx = canvas.getContext('2d');
        
        // Aspect ratio presets: null = keep original image ratio
        const RATIO_PRESETS = {
            'original': null,
            '9:16': { w: 1080, h: 1920 },
            '9:19.5': { w: 1080, h: 2340 },
            '16:9': { w: 1920, h: 1080 }
        };
        let ratioMode = 'original';
        
        function changeRatio(mode, element) {
            ratioMode = mode;
            document.querySelectorAll('.ratio-btn').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            updateRatioHint();
            if (currentImage) {
                setupCanvas();
                drawCanvas();
            }
        }
        
        // Apply settings from localStorage (font size; the app is light-only since v3)
        function loadAppSettings() {
            // Font size from settings
            const fontSize = localStorage.getItem('fontSize') || 'medium';
            applyFontSize(fontSize);
        }
        
        function applyFontSize(size) {
            const root = document.documentElement;
            if (size === 'small') {
                root.style.setProperty('--base-font-size', '14px');
                root.style.setProperty('--quote-font-size', '1.4rem');
            } else if (size === 'large') {
                root.style.setProperty('--base-font-size', '18px');
                root.style.setProperty('--quote-font-size', '1.8rem');
            } else {
                root.style.setProperty('--base-font-size', '16px');
                root.style.setProperty('--quote-font-size', '1.6rem');
            }
        }
        
        // Load daily passage (liturgical calendar first, date-hash fallback)
        let liturgicalDays = null;
        let calendarWrapYear = 2026;
        async function loadCalendar() {
            if (liturgicalDays) return;
            try {
                const response = await fetch('data/calendar.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Failed to load calendar');
                const data = await response.json();
                liturgicalDays = (data && data.days) ? data.days : {};
                calendarWrapYear = (data && data.wrapYear) || 2026;
            } catch (error) {
                console.warn('calendar.json could not be loaded — using date-hash selection.', error);
                liturgicalDays = {};
            }
        }

        async function loadDailyQuote() {
            try {
                const fileName = 'data/bsb.bible.json';
                // cache: 'no-cache' => data updates appear after a simple reload
                const response = await fetch(fileName, { cache: 'no-cache' });
                if (!response.ok) throw new Error('Failed to load');
                const data = await response.json();
                currentQuotes = data.passages || [];
            } catch (error) {
                console.error(`Could not load passages JSON (if this is a SyntaxError, the JSON file has a syntax mistake, e.g. a missing comma):`, error);
                currentQuotes = fallbackQuotes.slice();
            }
            await loadCalendar();
            
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            const day = today.getDate();
            const pad = n => String(n).padStart(2, '0');
            const dateKey = `${year}-${pad(month + 1)}-${pad(day)}`;
            let quote = null;
            if (liturgicalDays) {
                let key = liturgicalDays[dateKey] ? dateKey : null;
                if (!key) {
                    let mm = pad(month + 1), dd = pad(day);
                    if (mm === '02' && dd === '29') dd = '28';
                    const wrapped = `${calendarWrapYear}-${mm}-${dd}`;
                    if (wrapped !== dateKey && liturgicalDays[wrapped]) key = wrapped;
                }
                if (key) quote = currentQuotes.find(q => q.id === liturgicalDays[key]);
            }
            if (!quote) {
                const seed = (year * 10000) + (month * 100) + day;
                quote = currentQuotes[seed % currentQuotes.length];
            }
            currentQuote = quote;
            
            settings.text = currentQuote.text || "";
            
            if (currentImage) drawCanvas();
        }

        // Event Listeners
        document.getElementById('image-input').addEventListener('change', handleImageUpload);
        
        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('upload-prompt').classList.add('drag-active');
        });
        dropZone.addEventListener('dragleave', () => document.getElementById('upload-prompt').classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('upload-prompt').classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) {
                document.getElementById('image-input').files = e.dataTransfer.files;
                handleImageUpload({ target: document.getElementById('image-input') });
            }
        });

        // Sliders
        document.getElementById('font-size').addEventListener('input', (e) => {
            settings.fontSize = parseInt(e.target.value);
            document.getElementById('size-val').textContent = settings.fontSize < 35 ? wpT('wp_small') : settings.fontSize > 60 ? wpT('wp_large') : wpT('wp_medium');
            drawCanvas();
        });

        document.getElementById('top-offset').addEventListener('input', (e) => {
            settings.top = parseInt(e.target.value);
            document.getElementById('top-val').textContent = settings.top + '%';
            drawCanvas();
        });

        document.getElementById('left-offset').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            settings.leftOffset = val;
            document.getElementById('left-val').textContent = val + '%';
            
            if (marginsLocked) {
                settings.rightOffset = val;
                document.getElementById('right-offset').value = val;
                document.getElementById('right-val').textContent = val + '%';
            }
            drawCanvas();
        });

        document.getElementById('right-offset').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            settings.rightOffset = val;
            document.getElementById('right-val').textContent = val + '%';
            
            if (marginsLocked) {
                settings.leftOffset = val;
                document.getElementById('left-offset').value = val;
                document.getElementById('left-val').textContent = val + '%';
            }
            drawCanvas();
        });

        function toggleLock() {
            marginsLocked = !marginsLocked;
            const btn = document.getElementById('lock-btn');
            const icon = document.getElementById('lock-icon');
            
            if (marginsLocked) {
                btn.classList.remove('unlocked');
                icon.textContent = 'lock';
                const leftVal = parseInt(document.getElementById('left-offset').value);
                settings.leftOffset = leftVal;
                settings.rightOffset = leftVal;
                document.getElementById('right-offset').value = leftVal;
                document.getElementById('left-val').textContent = leftVal + '%';
                document.getElementById('right-val').textContent = leftVal + '%';
                drawCanvas();
            } else {
                btn.classList.add('unlocked');
                icon.textContent = 'lock_open';
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    originalImage = img;
                    
                    const infoEl = document.getElementById('image-info');
                    infoEl.textContent = `${originalWidth} × ${originalHeight}`;
                    infoEl.classList.add('visible');
                    
                    currentImage = img;
                    setupCanvas();
                    document.getElementById('upload-prompt').style.display = 'none';
                    document.getElementById('change-btn').classList.add('visible');
                    document.getElementById('download-btn').disabled = false;
                    
                    drawCanvas();
                    showToast(wpT('toast_image_loaded').replace('{w}', originalWidth).replace('{h}', originalHeight));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Size the preview canvas according to the selected aspect ratio
        function setupCanvas() {
            let targetW, targetH;
            if (ratioMode === 'original') {
                targetW = originalWidth;
                targetH = originalHeight;
            } else {
                const p = RATIO_PRESETS[ratioMode];
                targetW = p.w;
                targetH = p.h;
            }
            
            let displayWidth = targetW;
            let displayHeight = targetH;
            const maxDisplayWidth = 1080;
            const maxDisplayHeight = 1920;
            
            if (displayWidth > maxDisplayWidth) {
                const ratio = maxDisplayWidth / displayWidth;
                displayHeight = displayHeight * ratio;
                displayWidth = maxDisplayWidth;
            }
            if (displayHeight > maxDisplayHeight) {
                const ratio = maxDisplayHeight / displayHeight;
                displayWidth = displayWidth * ratio;
                displayHeight = maxDisplayHeight;
            }
            
            canvas.width = Math.round(displayWidth);
            canvas.height = Math.round(displayHeight);
        }

        // Draw image covering the full target area (center crop)
        function drawCoverCrop(context, img, w, h) {
            const scale = Math.max(w / img.width, h / img.height);
            const sw = w / scale;
            const sh = h / scale;
            const sx = (img.width - sw) / 2;
            const sy = (img.height - sh) / 2;
            context.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        }

        function drawCanvas() {
            if (!currentImage || !originalImage) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ratioMode === 'original') {
                ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            } else {
                drawCoverCrop(ctx, originalImage, canvas.width, canvas.height);
            }
            
            if (settings.text) {
                drawTextPreview();
            }
        }

        function drawTextPreview() {
            const leftX = (settings.leftOffset / 100) * canvas.width;
            const rightX = canvas.width - ((settings.rightOffset / 100) * canvas.width);
            const maxWidth = rightX - leftX;
            const centerY = (settings.top / 100) * canvas.height;
            
            // Consistent with export: font size scales with canvas width
            const sizeUnit = canvas.width / 400;
            const displayFontSize = settings.fontSize * sizeUnit;
            
            ctx.font = `${displayFontSize}px "${settings.font}"`;
            ctx.fillStyle = settings.color;
            ctx.textBaseline = 'middle';
            
            if (settings.shadow) {
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 8 * sizeUnit;
                ctx.shadowOffsetX = 2 * sizeUnit;
                ctx.shadowOffsetY = 2 * sizeUnit;
            }
            
            const lineHeight = displayFontSize * 1.3;
            const words = settings.text.split(' ');
            let line = '';
            let lines = [];
            
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);
            
            const totalHeight = lines.length * lineHeight;
            const startY = centerY - (totalHeight / 2) + (lineHeight / 2);
            
            lines.forEach((lineText, i) => {
                let x;
                if (settings.align === 'left') {
                    x = leftX;
                } else if (settings.align === 'right') {
                    x = rightX;
                } else {
                    x = leftX + (maxWidth / 2);
                }
                ctx.textAlign = settings.align;
                ctx.fillText(lineText.trim(), x, startY + (i * lineHeight));
            });
            
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        function downloadWallpaper() {
            if (!originalImage) return;
            
            let outW, outH;
            if (ratioMode === 'original') {
                outW = originalWidth;
                outH = originalHeight;
            } else {
                const preset = RATIO_PRESETS[ratioMode];
                outW = preset.w;
                outH = preset.h;
            }
            
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = outW;
            exportCanvas.height = outH;
            const exportCtx = exportCanvas.getContext('2d');
            
            if (ratioMode === 'original') {
                exportCtx.drawImage(originalImage, 0, 0, outW, outH);
            } else {
                drawCoverCrop(exportCtx, originalImage, outW, outH);
            }
            
            if (settings.text) {
                const leftX = (settings.leftOffset / 100) * outW;
                const rightX = outW - ((settings.rightOffset / 100) * outW);
                const maxWidth = rightX - leftX;
                const centerY = (settings.top / 100) * outH;
                
                const sizeUnit = outW / 400;
                const fontSize = settings.fontSize * sizeUnit;
                
                exportCtx.font = `${fontSize}px "${settings.font}"`;
                exportCtx.fillStyle = settings.color;
                exportCtx.textBaseline = 'middle';
                
                if (settings.shadow) {
                    exportCtx.shadowColor = 'rgba(0,0,0,0.6)';
                    exportCtx.shadowBlur = 8 * sizeUnit;
                    exportCtx.shadowOffsetX = 2 * sizeUnit;
                    exportCtx.shadowOffsetY = 2 * sizeUnit;
                }
                
                const lineHeight = fontSize * 1.3;
                const words = settings.text.split(' ');
                let line = '';
                let lines = [];
                
                for (let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    if (exportCtx.measureText(testLine).width > maxWidth && n > 0) {
                        lines.push(line);
                        line = words[n] + ' ';
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);
                
                const totalHeight = lines.length * lineHeight;
                const startY = centerY - (totalHeight / 2) + (lineHeight / 2);
                
                lines.forEach((lineText, i) => {
                    let x;
                    if (settings.align === 'left') {
                        x = leftX;
                    } else if (settings.align === 'right') {
                        x = rightX;
                    } else {
                        x = leftX + (maxWidth / 2);
                    }
                    exportCtx.textAlign = settings.align;
                    exportCtx.fillText(lineText.trim(), x, startY + (i * lineHeight));
                });
            }
            
            const link = document.createElement('a');
            link.download = `credo-wallpaper-${outW}x${outH}-${new Date().toISOString().split('T')[0]}.png`;
            link.href = exportCanvas.toDataURL('image/png', 1.0);
            link.click();
            
            showToast(wpT('toast_saved').replace('{w}', outW).replace('{h}', outH));
        }

        function changeFont(font, element) {
            settings.font = font;
            document.querySelectorAll('.font-option').forEach(el => {
                el.classList.remove('active');
                el.setAttribute('aria-pressed', 'false');
            });
            element.classList.add('active');
            element.setAttribute('aria-pressed', 'true');
            drawCanvas();
        }

        function changeColor(color, element) {
            settings.color = color;
            document.querySelectorAll('.color-swatch').forEach(el => {
                if (!el.classList.contains('color-wheel')) {
                    el.classList.remove('active');
                    el.setAttribute('aria-pressed', 'false');
                }
            });
            if (element) {
                element.classList.add('active');
                element.setAttribute('aria-pressed', 'true');
            }
            drawCanvas();
        }

        function changeAlign(align, element) {
            settings.align = align;
            document.querySelectorAll('.align-btn').forEach(el => {
                el.classList.remove('active');
                el.setAttribute('aria-pressed', 'false');
            });
            element.classList.add('active');
            element.setAttribute('aria-pressed', 'true');
            drawCanvas();
        }

        let lastColorTrigger = null;

        function openColorPicker() {
            lastColorTrigger = document.activeElement;
            updateRecentColorsDisplay();
            const modal = document.getElementById('color-modal');
            modal.classList.add('open');
            document.body.classList.add('modal-open');
            const done = modal.querySelector('.close-color-modal');
            if (done) setTimeout(() => done.focus(), 80);
        }

        function closeColorPicker(e) {
            if (!e || e.target.id === 'color-modal' || e.target.classList.contains('close-color-modal')) {
                const modal = document.getElementById('color-modal');
                modal.classList.remove('open');
                document.body.classList.remove('modal-open');
                if (lastColorTrigger && typeof lastColorTrigger.focus === 'function') lastColorTrigger.focus();
                lastColorTrigger = null;
            }
        }

        // Escape closes the color modal (this page does not load js/app.js)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('color-modal').classList.contains('open')) {
                closeColorPicker();
            }
        });

        function handleColorPick(color) {
            settings.color = color;
            document.getElementById('current-color-display').style.background = color;
            document.querySelectorAll('.color-swatch:not(.color-wheel)').forEach(el => el.classList.remove('active'));
            addToRecentColors(color);
            updateRecentColorsDisplay();
            drawCanvas();
            showToast(wpT('toast_color'));
        }

        function addToRecentColors(color) {
            recentColors = recentColors.filter(c => c !== color);
            recentColors.unshift(color);
            recentColors = recentColors.slice(0, 6);
            localStorage.setItem('recentColors', JSON.stringify(recentColors));
        }

        function updateRecentColorsDisplay() {
            const grid = document.getElementById('recent-colors-grid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const div = document.createElement('div');
                if (recentColors[i]) {
                    div.className = 'recent-color';
                    div.style.background = recentColors[i];
                    div.onclick = () => selectRecentColor(recentColors[i]);
                } else {
                    div.className = 'recent-color empty';
                }
                grid.appendChild(div);
            }
        }

        function selectRecentColor(color) {
            settings.color = color;
            document.getElementById('current-color-display').style.background = color;
            document.getElementById('color-picker-input').value = color;
            document.querySelectorAll('.color-swatch:not(.color-wheel)').forEach(el => el.classList.remove('active'));
            addToRecentColors(color);
            drawCanvas();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadAppSettings(); // Apply font size and theme from settings
            applyWallpaperLanguage(); // Apply English UI texts
            updateRecentColorsDisplay();
            loadDailyQuote();
        });

        window.addEventListener('resize', () => {
            if (currentImage) drawCanvas();
        });
    </script>
</body>
</html>
