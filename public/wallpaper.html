        function addToRecentColors(color) {
            recentColors = recentColors.filter(c => c !== color);
            recentColors.unshift(color);
            recentColors = recentColors.slice(0, 6);
            localStorage.setItem('recentColors', JSON.stringify(recentColors));
        }

        function updateRecentColorsDisplay() {
            const grid = document.getElementById('recent-colors-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const div = document.createElement('div');
                if (recentColors[i]) {
                    div.className = 'recent-color';
                    div.style.background = recentColors[i];
                    div.onclick = () => selectRecentColor(recentColors[i]);
                } else {
                    div.className = 'recent-color empty';
                }
                grid.appendChild(div);
            }
        }

        function selectRecentColor(color) {
            const rgb = hexToRgb(color);
            if (rgb) {
                cpState = rgbToHsv(rgb[0], rgb[1], rgb[2]);
                applyCustomColor(color);
                cpSyncUI();
            }
            closeColorPicker();     // picking a recent is decision enough
        }

        // ── Export: save / share ──────────────────────────────────────
        function buildExportCanvas() {
            const spec = ratioSpec(settings.ratio);
            const out = document.createElement('canvas');
            out.width = spec.w;
            out.height = spec.h;
            renderInto(out.getContext('2d'), spec.w, spec.h);
            return out;
        }

        function exportFileName(spec) {
            return `credo-wallpaper-${spec.w}x${spec.h}-${new Date().toISOString().split('T')[0]}.png`;
        }

        function downloadWallpaper() {
            if (!originalImage) return;
            const out = buildExportCanvas();
            const spec = { w: out.width, h: out.height };
            const link = document.createElement('a');
            link.download = exportFileName(spec);
            link.href = out.toDataURL('image/png', 1.0);
            link.click();
            showToast(wpT('toast_saved').replace('{w}', spec.w).replace('{h}', spec.h));
        }

        async function shareWallpaper() {
            if (!originalImage) return;
            const out = buildExportCanvas();
            const blob = await new Promise(res => out.toBlob(res, 'image/png'));
            if (!blob) return;
            const file = new File([blob], exportFileName({ w: out.width, h: out.height }), { type: 'image/png' });
            try {
                await navigator.share({
                    files: [file],
                    title: 'Credo',
                    text: currentQuote ? (currentQuote.text + ' — ' + currentQuote.author) : ''
                });
                showToast(wpT('toast_shared'));
            } catch (err) {
                if (err && err.name !== 'AbortError') console.warn('share failed:', err);
            }
        }

        // Show Share only where the platform supports file sharing
        if (navigator.canShare) {
            try {
                const probe = new File([new Blob(['x'])], 'p.png', { type: 'image/png' });
                if (navigator.canShare({ files: [probe] })) {
                    document.getElementById('share-btn').style.display = 'inline-flex';
                }
            } catch (e) { /* stay hidden */ }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Apply the app-wide UI font size to the editor shell
        function applyFontSize(size) {
            const root = document.documentElement;
            if (size === 'small') {
                root.style.setProperty('--base-font-size', '14px');
            } else if (size === 'large') {
                root.style.setProperty('--base-font-size', '18px');
            } else {
                root.style.setProperty('--base-font-size', '16px');
            }
        }

        // ── Init ──────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            applyFontSize(localStorage.getItem('fontSize') || 'medium');
            applyWallpaperLanguage();
            initPhoneChipLabel();
            updateRecentColorsDisplay();
            syncTypographyUI();
            syncColorUI();
            syncOutlineUI();
            if (dragHintDone) document.getElementById('drag-hint').style.display = 'none';
            // restore active ratio chip
            document.querySelectorAll('.ratio-btn').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-ratio') === settings.ratio);
            });
            gotoStep(1);
            loadDailyQuote();
            // Canvas does not load @font-face faces on its own — request the
            // italic reference face explicitly, then redraw when it arrives.
            ensureRefFontReady();
            // Canvas fonts may finish loading after the first draw
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => { if (currentImage) drawCanvas(); });
            }
        });

        window.addEventListener('resize', () => {
            if (currentImage) drawCanvas();
        });
    </script>
</body>
</html>
